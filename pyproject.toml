[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livepush"
version = "2.1.2"
description = "Bilibili live status monitor with QQ push and a self-hosted admin Web UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    # SQLAlchemy 2.1 起 greenlet 只挂在 [asyncio] extra 上，不写 extra 会缺 greenlet
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "jinja2>=3.1",
    "websockets>=12",
    "qrcode>=7.4",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
livepush = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
